[project]
name = "oeis-formalize"
version = "0.1.0"
description = "LLM-driven translation of OEIS program blocks (Maple first) into Lean 4"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-ai-slim[openai,google]>=0.4.0",
]

[project.scripts]
oeis-formalize = "formalize.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Scripts/formalize"]
