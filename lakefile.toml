name = "LOEIS"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LOEIS"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Generated LOEIS skeletons have unused binders and long term lists by construction.
weak.linter.unusedVariables = false
weak.linter.style.longLine = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc1"

[[require]]
name = "leansqlite"
scope = "leanprover"
rev = "main"


[[lean_lib]]
name = "LOEIS"
globs = ["LOEIS.+"]

# Scratch library for generated validation modules; not part of `defaultTargets`.
[[lean_lib]]
name = "Check"
globs = ["Check.+"]

[[lean_lib]]
name = "Scripts"
roots = ["Scripts.OeisIngest", "Scripts.OeisGen", "Scripts.OeisCache",
         "Scripts.LinearRecurrenceWolfram"]
globs = ["Scripts.OeisIngest.+", "Scripts.OeisGen.+", "Scripts.OeisCache",
         "Scripts.LinearRecurrenceWolfram"]

[[lean_exe]]
name = "oeis-ingest"
root = "Scripts.OeisIngest"

[[lean_exe]]
name = "oeis-gen"
root = "Scripts.OeisGen"

[[lean_exe]]
name = "oeis-cache"
root = "Scripts.OeisCache"

[[lean_exe]]
name = "oeis-linearrec"
root = "Scripts.LinearRecurrenceWolfram"
