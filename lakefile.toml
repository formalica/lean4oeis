name = "LOEIS"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LOEIS"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Generated LOEIS skeletons have unused binders and long term lists by construction.
weak.linter.unusedVariables = false
weak.linter.style.longLine = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc1"

[[require]]
name = "leansqlite"
scope = "leanprover"
rev = "main"


[[lean_lib]]
name = "LOEIS"
globs = ["LOEIS.+"]

# Shared generic libraries (walk counting etc.) used by template-generated sequence files.
[[lean_lib]]
name = "OEISLib"
globs = ["OEISLib.+"]

# Standalone formula parser (OEIS.md §PARSER). Imports Lean/core only — no LOEIS deps.
[[lean_lib]]
name = "FormulaParser"
globs = ["FormulaParser.+"]

[[lean_lib]]
name = "Scripts"
roots = ["Scripts.OeisIngest", "Scripts.OeisGen", "Scripts.OeisCache", "Scripts.OeisTemplate"]
globs = ["Scripts.OeisIngest.+", "Scripts.OeisGen.+", "Scripts.OeisCache",
         "Scripts.OeisTemplate.+", "Scripts.Templates.+"]

[[lean_exe]]
name = "oeis-template"
root = "Scripts.OeisTemplate"

[[lean_exe]]
name = "oeis-ingest"
root = "Scripts.OeisIngest"

[[lean_exe]]
name = "oeis-gen"
root = "Scripts.OeisGen"

[[lean_exe]]
name = "oeis-cache"
root = "Scripts.OeisCache"
